# ==============================
# SERVER
# ==============================

server.port=8080


# ==============================
# DATABASE
# ==============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_analyzer?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET:VGhpcy1pcy1hLWxvbmctZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0xMjM0NTY3ODkw}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==============================
# CORS
# ==============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}


# ==============================
# AI
# ==============================

ai.api-key=${AI_API_KEY:}
ai.api-url=${AI_API_URL:}
ai.model=${AI_MODEL:}


# ==============================
# ACTUATOR / HEALTH
# ==============================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never